<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>精致白领，朋友圈没有茅台拿铁（注释学习版）</title>
</head>
<body>
<div>

<!--
====================================================================
  整体结构说明
====================================================================

这个页面是一个纯 SVG SMIL 动画实现的交互式长图，完全没有 JavaScript。

核心思路：
  1. 把多个"场景"叠在一起（通过 z-index 控制谁在最上面）
  2. 用 SMIL 动画的 begin="click" 监听用户点击
  3. 点击后，通过 opacity（显隐）+ translate（位移）切换场景
  4. 用 restart="never" 确保每个动画只触发一次（不可逆）

层级关系（从上到下）：
  z-index:200 → 开场轮播层（最先显示，点击后消失）
  z-index:100 → 卡牌翻转层（8 张卡片，逐张翻转）
  z-index:3   → 长图展开层（最后显示）
  z-index:1   → 商品信息层（中间穿插的内容）

交互流程：
  页面加载 → 自动轮播播放
  第 1 次点击 → 轮播消失，第 1 张卡片出现
  第 2 次点击 → 第 1 张卡片翻转，新内容飞入
  第 3 次点击 → 第 2 张卡片翻转
  ...（重复 8 次）
  最后一次点击 → 底部长图展开
====================================================================
-->

<!-- ================================================================
  第一层：页面总容器
  ================================================================
  为什么要设 pointer-events:none？
  → 因为这个容器包裹了所有内容，如果它接收点击，会拦截内部子元素的事件
  → 设为 none 后，点击事件会"穿透"到内部的具体元素上

  为什么要 width:88vw？
  → 微信公众号文章的正文宽度约为屏幕宽度的 88%
=================================================================== -->
<section style="line-height:0;margin:0px auto 0vw;pointer-events:none;font-size:0px;visibility:visible;overflow:hidden;width:88vw !important;">

  <!-- ==============================================================
    背景铺底层
    ==============================================================
    为什么要两个 rect？
    → 第一个黑色 rect 是最底层的背景色
    → 第二个浅蓝色 rect (#79BFDC) 覆盖在上面，作为页面主色调

    为什么 height:81176 这么大？
    → 因为整个页面有很多内容（8 张卡片 + 商品信息 + 长图）
    → 需要一个足够大的背景覆盖所有内容

    为什么要 height:0 的 section？
    → SVG 的 viewBox 定义了坐标系，但 section 的高度由内容撑开
    → 设为 0 后，高度完全由内部 SVG 的实际内容决定
    → 这样可以精确控制每个区域的尺寸
  ================================================================ -->
  <section style="height:0;">
    <svg viewBox="0 0 345 586.5"></svg>
    <svg style="margin-right:0px;" viewBox="0 0 345 81100">
      <rect fill="#000000" height="81176" width="400" x="-0.5" y="-0.5"></rect>
      <rect fill="#79BFDC" height="81176" width="400" x="-0.5" y="-0.5"></rect>
    </svg>
  </section>

  <!-- ==============================================================
    主内容区（flex 纵向排列）
    ==============================================================
    所有交互内容都在这个 flex 容器里，按顺序纵向排列：
    1. 轮播层（z-index:200）
    2. 商品信息区（z-index:1）
    3. 卡牌翻转区（z-index:100）
    4. 长图展开区（z-index:3）
  ================================================================ -->
  <section style="display:flex;overflow:hidden;line-height:0;flex-direction:column;">


    <!-- ============================================================
      【阶段一】开场轮播层
      ============================================================
      这是用户看到的第一个画面，包含：
      1. 一张固定的背景图（茅台拿铁场景）
      2. 一个自动播放的帧动画（8 张图循环切换）
      3. 一个幕帘展开效果（从上往下逐渐显示）

      关键属性：
      - z-index:200 → 在最上层，优先显示
      - height:0 → 折叠状态，靠 SVG 内容撑开
      ============================================================ -->
    <section style="height:0;z-index:200;">
      <svg viewBox="0 0 345 586.5">

        <!-- === 整个轮播层的控制组 === -->
        <g>
          <!--
            【动画 1】点击后整个轮播层淡出

            原理：
            - begin="click" → 监听点击事件
            - dur="1000s" → 动画持续 1000 秒（为什么这么长？见下方说明）
            - fill="freeze" → 动画结束后保持最终状态（opacity=0，即不可见）
            - restart="never" → 只触发一次，不能回头

            为什么 dur="1000s" 而不是 dur="1s"？
            → SMIL 动画的实际播放节奏由 keyTimes 控制
            → keyTimes="0;0.0003;1" 表示：
              - 0% 时刻（刚开始）：values 的第 1 个值（opacity=1）
              - 0.03% 时刻（1000s × 0.0003 = 0.3秒）：values 的第 2 个值（opacity=0）
              - 100% 时刻（1000s 结束）：values 的第 3 个值（opacity=0）
            → 所以实际动画时间只有 0.3 秒（从 1 淡出到 0）
            → 剩下的 999.7 秒都是静止的（保持 opacity=0）

            为什么不用 dur="0.3s"？
            → 因为 SMIL 动画在 dur 结束后会根据 fill 属性决定行为
            → fill="freeze" 会保持最终值，但如果 dur 太短，浏览器可能优化掉动画
            → 用超长 dur + keyTimes 是微信 SVG 的常见技巧，确保动画可靠执行
          -->
          <animate attributeName="opacity" begin="click" dur="1000s"
            fill="freeze" keyTimes="0;0.0003;1" restart="never"
            values="1;0;0"/>


          <!--
            【动画 2】点击后轮播层飞出画面

            原理：
            - opacity="0" → 初始不可见（但元素仍在 DOM 中）
            - pointer-events:visible → 虽然看不见，但能接收点击事件
              （这是关键技巧：用透明元素拦截点击）

            - calcMode="discrete" → 跳帧模式（不是平滑过渡）
              比如 values="A;B;C" 会直接从 A 跳到 B，再跳到 C
              而不是从 A 平滑过渡到 B 再到 C

            - keyTimes="0;0.000001;1" → 在几乎 0% 的时间就完成切换
              1000s × 0.000001 = 0.001 秒（1毫秒）就从 0 跳到 -1000

            - values="0 0;-1000 0;-1000 0"
              → translate(x, y)：x=-1000 表示向左移动 1000 像素
              → 1000 像素远超屏幕宽度，所以是"飞出画面"

            为什么要 translate 而不是 display:none？
            → 因为 display:none 会让元素完全消失，无法再接收事件
            → translate 到画面外既看不见，又不影响布局
          -->
          <g opacity="0" style="pointer-events:visible;">
            <animateTransform attributeName="transform" begin="click"
              calcMode="discrete" dur="1000s" fill="freeze"
              keyTimes="0;0.000001;1" restart="never"
              type="translate" values="0 0;-1000 0;-1000 0"/>
            <rect fill="#000000" height="100%" opacity="0"
              style="pointer-events:visible;" width="100%"/>
          </g>


          <!-- === 固定背景图（茅台拿铁场景） === -->
          <g>
            <foreignObject height="100%" width="100%" x="0" y="0">
              <!--
                为什么用 foreignObject 而不是 <image>？
                → foreignObject 可以在 SVG 里嵌入 HTML 内容
                → 这里用 CSS background-image 显示图片
                → 这样可以用 CSS 的 background-size:100% 让图片自适应宽度
              -->
              <svg style="background-image:url(&quot;...封面图...&quot;);
                background-size:100%;background-repeat:no-repeat;
                margin-top:-0vw;line-height:0;"
                viewBox="0 0 345 586.5"></svg>
            </foreignObject>
          </g>


          <!--
            【动画 3】自动帧动画（核心：像 GIF 一样播放）

            原理：
            - 8 张图片横排，每张 345px 宽
            - 通过 translate 动画，每 0.3 秒向左跳 1000px
            - 因为 calcMode="discrete"，所以是跳帧而非平滑滚动

            为什么每张间隔 1000px 而不是 345px？
            → 因为 foreignObject 的宽度是 100%（345px）
            → 但实际图片可能有边距或留白
            → 用 1000px 间隔可以确保每帧完整显示一张图

            为什么 values 有 9 个值（8 张图 + 1 张循环）？
            → 第 9 张图和第 1 张图相同
            → 当动画循环回到起点时，视觉上是无缝衔接的

            repeatCount="indefinite" → 无限循环
            restart="always" → 每次循环都重新开始
          -->
          <g>
            <animateTransform attributeName="transform" begin="0"
              calcMode="discrete" dur="0.3s" fill="freeze"
              repeatCount="indefinite" restart="always"
              type="translate"
              values="-1000 0;-2000 0;-3000 0;-4000 0;-5000 0;-6000 0;-7000 0;-8000 0"/>

            <!-- 8 帧图片横排 -->
            <g>
              <g transform="translate(0 0)"><!-- 帧 1：初始位置 -->
                <foreignObject height="100%" width="100%" x="0" y="0">
                  <svg style="background-image:url(&quot;...帧1...&quot;);background-size:100%;background-repeat:no-repeat;display:inline;line-height:0;" viewBox="0 0 345 586.5"></svg>
                </foreignObject>
              </g>
              <g transform="translate(1000 0)"><!-- 帧 2：向右偏移 1000px -->
                <foreignObject height="100%" width="100%" x="0" y="0">
                  <svg style="background-image:url(&quot;...帧2...&quot;);background-size:100%;background-repeat:no-repeat;display:inline;line-height:0;" viewBox="0 0 345 586.5"></svg>
                </foreignObject>
              </g>
              <g transform="translate(2000 0)"><!-- 帧 3 -->
                <foreignObject height="100%" width="100%" x="0" y="0">
                  <svg style="background-image:url(&quot;...帧3...&quot;);background-size:100%;background-repeat:no-repeat;display:inline;line-height:0;" viewBox="0 0 345 586.5"></svg>
                </foreignObject>
              </g>
              <g transform="translate(3000 0)"><!-- 帧 4 -->
                <foreignObject height="100%" width="100%" x="0" y="0">
                  <svg style="background-image:url(&quot;...帧4...&quot;);background-size:100%;background-repeat:no-repeat;display:inline;line-height:0;" viewBox="0 0 345 586.5"></svg>
                </foreignObject>
              </g>
              <g transform="translate(4000 0)"><!-- 帧 5 -->
                <foreignObject height="100%" width="100%" x="0" y="0">
                  <svg style="background-image:url(&quot;...帧5...&quot;);background-size:100%;background-repeat:no-repeat;display:inline;line-height:0;" viewBox="0 0 345 586.5"></svg>
                </foreignObject>
              </g>
              <g transform="translate(5000 0)"><!-- 帧 6 -->
                <foreignObject height="100%" width="100%" x="0" y="0">
                  <svg style="background-image:url(&quot;...帧6...&quot;);background-size:100%;background-repeat:no-repeat;display:inline;line-height:0;" viewBox="0 0 345 586.5"></svg>
                </foreignObject>
              </g>
              <g transform="translate(6000 0)"><!-- 帧 7 -->
                <foreignObject height="100%" width="100%" x="0" y="0">
                  <svg style="background-image:url(&quot;...帧7...&quot;);background-size:100%;background-repeat:no-repeat;display:inline;line-height:0;" viewBox="0 0 345 586.5"></svg>
                </foreignObject>
              </g>
              <g transform="translate(7000 0)"><!-- 帧 8 -->
                <foreignObject height="100%" width="100%" x="0" y="0">
                  <svg style="background-image:url(&quot;...帧8...&quot;);background-size:100%;background-repeat:no-repeat;display:inline;line-height:0;" viewBox="0 0 345 586.5"></svg>
                </foreignObject>
              </g>
              <g transform="translate(8000 0)"><!-- 帧 9（= 帧 1，循环用） -->
                <foreignObject height="100%" width="100%" x="0" y="0">
                  <svg style="background-image:url(&quot;...帧9...&quot;);background-size:100%;background-repeat:no-repeat;display:inline;line-height:0;" viewBox="0 0 345 586.5"></svg>
                </foreignObject>
              </g>
            </g>
          </g>


          <!--
            【动画 4】幕帘展开效果

            原理：
            - 一个 SVG 元素，初始高度只有 1px
            - 背景图是一张完整的场景图
            - 高度从 100 扩展到 586.5（整个视口高度）
            - 背景图会随高度变化逐渐显示出来
            - 视觉效果：像幕布从上往下拉开

            为什么 begin="0"？
            → 0 表示页面加载后立即开始
            → 不需要等待用户交互

            为什么 pointer-events:none？
            → 这个幕帘只是视觉效果，不应该拦截点击
            → 点击应该穿透到下面的轮播层
          -->
          <g style="pointer-events:none;">
            <foreignObject height="592.71" style="" width="345" x="0" y="0">
              <svg height="1"
                style="display:inline-block;width:100%;vertical-align:top;
                  background-position:0% 0%;background-repeat:no-repeat;
                  background-size:100%;background-attachment:scroll;
                  background-image:url(&quot;...幕帘图...&quot;);
                  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;"
                width="345">
                <animate attributeName="height" begin="0" dur="6s"
                  fill="freeze" restart="never" values="100;586.5"/>
              </svg>
            </foreignObject>
          </g>


          <!-- === 最终覆盖图（幕帘展开后显示） === -->
          <g>
            <foreignObject height="100%" width="100%" x="0" y="0">
              <svg style="background-image:url(&quot;...最终图...&quot;);
                background-size:100%;background-repeat:no-repeat;
                margin-top:-0vw;line-height:0;"
                viewBox="0 0 345 586.5"></svg>
            </foreignObject>
          </g>

        </g>
      </svg>
    </section>
    <!-- ===== 轮播层结束 ===== -->


    <!-- ============================================================
      【阶段二】商品信息区 (z-index:1)
      ============================================================
      在轮播层下方，包含：
      1. 商品主图（缩放显示）
      2. 触摸弹出效果（touchmove 触发）
      3. 商品详情长图
      4. iframe 嵌入（可能是视频）
      5. 淘口令

      这个区域不需要用户交互，只是展示信息
      ============================================================ -->
    <section style="height:0;z-index:1;">
      <svg enable-background="new 0 0 345 1298.49" version="1.1"
        viewBox="0 0 345 1298.49" x="0px" xml:space="preserve"
        xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" y="0px">

        <!-- 商品主图（缩放后） -->
        <g>
          <foreignObject style="" x="0" y="0"
            transform="matrix(0.345 0 0 0.345 0 870)" width="1000" height="1242">
            <!--
              matrix(a b c d e f) 变换矩阵说明：
              → a=0.345, d=0.345: 水平和垂直缩放 34.5%
              → b=0, c=0: 没有旋转或倾斜
              → e=0, f=870: 水平不动，垂直向下偏移 870px
              → 效果：把 1000×1242 的大图缩放到 345×428，然后向下移动
            -->
            <svg style="display:inline-block;width:100%;vertical-align:top;
              background-position:0% 0%;background-repeat:no-repeat;
              background-size:100%;background-attachment:scroll;
              background-image:url(&quot;...商品图...&quot;);
              -webkit-tap-highlight-color:transparent;-webkit-user-select:none;"
              viewBox="0 0 1000 1242"></svg>
          </foreignObject>
        </g>

        <!--
          【动画 5】触摸弹出效果

          原理：
          1. 初始状态：opacity=0，scale=1（看不见）
          2. 页面加载后立即：scale 从 1→0.1（缩小到几乎看不见）
          3. 用户 touchmove 后：
             a. opacity 从 0→1（显示）
             b. scale 从 0.1→1.1→1（先放大到 110%，再回弹到 100%）
             c. 遮挡的黑色 rect 移出画面

          为什么用 touchmove 而不是 click？
          → touchmove 是手指滑动时触发
          → 这个效果是"滑动查看"，不是"点击切换"
          → 用户滑动屏幕时，商品图会弹性弹出

          为什么 scale 要先到 1.1 再到 1？
          → 这是"弹性动画"效果（overshoot）
          → 先略微放大再回弹，感觉更自然、有弹性
          → keyTimes="0;0.8;1" 表示 80% 的时间在放大，最后 20% 回弹
        -->
        <g opacity="0" transform-origin="50.0% 92%">
          <animate attributeName="opacity" begin="touchmove" dur="1000s"
            fill="freeze" keyTimes="0;0.0003;1" restart="never" values="0;1;1"/>
          <animateTransform attributeName="transform" begin="0" dur="1s"
            fill="freeze" repeatCount="1" restart="never" type="scale" values="1;0.1;0.1"/>
          <animateTransform attributeName="transform" begin="touchmove" dur="1s"
            fill="freeze" keyTimes="0;0.8;1" repeatCount="1" restart="never"
            type="scale" values="0.1;1.1;1"/>
          <!-- 遮挡 rect：touchmove 后移到 10000（画面外） -->
          <g opacity="0" style="pointer-events:visible;">
            <animateTransform attributeName="transform" begin="touchmove"
              calcMode="discrete" dur="1000s" fill="freeze"
              keyTimes="0;0.000001;1" restart="never"
              type="translate" values="0 0;10000 0;10000 0"/>
            <rect fill="#000000" height="10000%" opacity="1"
              style="pointer-events:visible;" width="10000%" x="-500.1%" y="-2500.1"/>
          </g>
          <!-- 弹出后的商品图 -->
          <foreignObject style="" x="0" y="0"
            transform="matrix(0.345 0 0 0.345 0 870)" width="1000" height="1242">
            <svg style="display:inline-block;width:100%;vertical-align:top;
              background-position:0% 0%;background-repeat:no-repeat;
              background-size:100%;background-attachment:scroll;
              background-image:url(&quot;...弹出图...&quot;);
              -webkit-tap-highlight-color:transparent;-webkit-user-select:none;"
              viewBox="0 0 1000 1242"></svg>
          </foreignObject>
        </g>
      </svg>

      <!-- 商品详情长图 -->
      <svg style="background-image:url(&quot;...详情1...&quot;);background-size:100%;background-repeat:no-repeat;margin-top:-0.33vw;line-height:0;" viewBox="0 0 345 372.945"></svg>

      <!-- iframe 嵌入（可能是视频或互动内容） -->
      <section style="height:0;transform:scale(1);">
        <section style="pointer-events:visible;margin:0 10%;">
          <iframe allowfullscreen="" frameborder="0" height="325"
            style="z-index:1;border-radius:4px;" width="578"></iframe>
        </section>
      </section>

      <!-- 更多详情图 -->
      <svg style="background-image:url(&quot;...详情2...&quot;);background-size:100%;background-repeat:no-repeat;margin-top:-0.33vw;line-height:0;" viewBox="0 0 345 186.68"></svg>
      <svg style="background-image:url(&quot;...详情3...&quot;);background-size:100%;background-repeat:no-repeat;margin-top:-0.33vw;line-height:0;" viewBox="0 0 345 59.685"></svg>

      <!-- 淘口令（白色文字，隐藏在画面中，用户可复制） -->
      <section style="height:0;transform:scale(1);">
        <p style="text-align:center;font-size:14px;line-height:14px;color:white;pointer-events:visible;">
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;49￥WjSddC5BMID￥&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        </p>
      </section>

      <!-- 底部装饰图 -->
      <svg style="background-image:url(&quot;...底1...&quot;);background-size:100%;background-repeat:no-repeat;margin-top:-0.33vw;line-height:0;" viewBox="0 0 345 34.5"></svg>
      <svg style="background-image:url(&quot;...底2...&quot;);background-size:100%;background-repeat:no-repeat;margin-top:-0.33vw;line-height:0;" viewBox="0 0 345 405.72"></svg>
    </section>
    <!-- ===== 商品信息区结束 ===== -->


    <!-- ============================================================
      【阶段三】卡牌翻转区（8 张卡片）
      ============================================================
      这是整个交互的核心部分，每张卡片的结构完全相同：

      每张卡片包含 3 个 SVG 层：
      A. 隐藏层（pointer-events:none）
         → 3 张背景图堆叠（底图、中图、顶图）
         → 初始不可见，用于提供翻转时的背景

      B. 交互层（有 click/touchstart 动画）
         → 监听用户点击/触摸
         → click 触发：opacity 从 0→1（显示新内容）
         → click 触发：translate 从 0→-10000（旧内容飞走）
         → touchstart 触发：拦截器防止重复点击

      C. 显示层（翻转动画 + 新图片飞入）
         → rotate 0°→90°（翻牌效果）
         → 新图片通过 matrix 变换预旋转，配合外层 rotate 实现翻牌
         → 翻转完成后 section 高度变 0（消失）

      为什么 8 张卡片结构相同？
      → 这是"模板化"设计：每张卡片只是图片不同，交互逻辑完全一致
      → 可以用工具批量生成，只需要替换图片 URL

      为什么卡片之间没有"前进/后退"按钮？
      → 因为 SMIL 动画不支持条件逻辑（没有 if/else）
      → 只能用 begin="click" 监听点击，每次点击触发下一个动画
      → 用户看到的就是"点击就翻下一张"
      ============================================================ -->
    <section style="height:0;">
      <section style="display:flex;overflow:hidden;line-height:0;flex-direction:column;">


        <!--
          ==========================================================
          卡片 1（详细注释，卡片 2~8 结构相同）
          ==========================================================
          交互流程：
          1. 页面加载后，这张卡片自动显示（opacity 从 0→1）
          2. 用户点击 → 卡片翻转（rotate 90°）
          3. 新图片从左侧飞入（translate -10000→0）
          4. 整个 section 高度变 0（消失）
          5. 下一张卡片自动显示
          ==========================================================
        -->
        <section style="overflow:hidden;z-index:100;">

          <!--
            === A. 隐藏层 ===
            pointer-events:none: 不接收点击（点击穿透到下层）
            height:0: 折叠状态，靠 SVG 内容撑开
          -->
          <section style="pointer-events:none;height:0;">
            <svg viewBox="0 0 345 586.5" x="0px" y="0px">
              <!-- 透明 rect：作为整个区域的点击热区 -->
              <rect fill="#000000" height="100%" opacity="0"
                style="pointer-events:visible;" width="100%"/>

              <!-- 3 张背景图堆叠（底图→中图→顶图） -->
              <g>
                <g><!-- 底图 -->
                  <foreignObject height="100%" width="100%" x="0" y="0">
                    <svg style="background-image:url(&quot;...底图...&quot;);background-size:100%;background-repeat:no-repeat;line-height:0;" viewBox="0 0 345 586.5"></svg>
                  </foreignObject>
                </g>
                <g><!-- 中图（翻转时会旋转） -->
                  <foreignObject height="100%" width="100%" x="0" y="0">
                    <svg style="background-image:url(&quot;...中图...&quot;);background-size:100%;background-repeat:no-repeat;line-height:0;" viewBox="0 0 345 586.5"></svg>
                  </foreignObject>
                </g>
                <g><!-- 顶图（翻转后可见） -->
                  <foreignObject height="100%" width="100%" x="0" y="0">
                    <svg style="background-image:url(&quot;...顶图...&quot;);background-size:100%;background-repeat:no-repeat;line-height:0;" viewBox="0 0 345 586.5"></svg>
                  </foreignObject>
                </g>
              </g>


              <!--
                === B. 交互层 ===
                这是整个卡片的核心：监听用户事件并触发动画

                关键设计：双事件触发器
                - click+0.01s: 点击后 0.01 秒触发（前进动画）
                - touchstart+0.21s: 触摸后 0.21 秒触发（回退动画）

                为什么要两个事件？
                → click 是完整的点击（按下+松开）
                → touchstart 只是手指按下（还没松开）
                → 如果用户只是触摸没有完成点击，0.21 秒后会回退
                → 这样可以区分"点击"和"触摸"

                为什么时间差是 0.2 秒（0.21-0.01）？
                → 0.2 秒是人类完成一次点击的典型时间
                → 如果 0.2 秒内没有松开手指，就认为是"触摸"而非"点击"
              -->
              <g opacity="0">
                <!--
                  opacity 动画 1：touchstart 触发（回退）
                  → 触摸后 0.21 秒：先显示（1→1）再隐藏（0→0）
                  → 效果：短暂闪现后消失（回退到原始状态）
                -->
                <animate additive="replace" attributeName="opacity"
                  begin="touchstart+0.21s" calcMode="spline" dur="1000s"
                  fill="remove"
                  keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
                  keyTimes="0;0.0000001;0.001;1" restart="always"
                  values="1;1;0;0"/>

                <!--
                  opacity 动画 2：click 触发（前进）
                  → 点击后 0.01 秒：从隐藏变为显示（0→0→1→1）
                  → 效果：新内容逐渐出现
                -->
                <animate additive="replace" attributeName="opacity"
                  begin="click+0.01s" calcMode="spline" dur="1000s"
                  fill="remove"
                  keySplines="0.42 0 0.58 1;0.42 0 0.58 1.0;0.42 0 0.58 1.0"
                  keyTimes="0;0.0003;0.0009;1" restart="always"
                  values="0;0;1;1"/>


                <!--
                  translate 动画组：控制元素水平位移

                  两个动画竞争同一个 transform 属性：
                  - click 触发：从 0→-10000（飞走）
                  - touchstart 触发：从 -10000→0（飞回）

                  additive="replace" → 后触发的动画会覆盖先触发的
                  所以：
                  - 如果用户点击：click 动画生效，元素飞走
                  - 如果用户触摸：touchstart 动画生效，元素飞回
                -->
                <g>
                  <!-- click 触发：元素飞走 -->
                  <animateTransform additive="replace" attributeName="transform"
                    begin="click+0.01s" calcMode="spline" dur="1000s"
                    fill="remove"
                    keySplines="0.42 0 0.58 1;0.42 0 0.58 1.0;0.42 0 0.58 1.0"
                    keyTimes="0;0.0003;0.00031;1" restart="always"
                    type="translate" values="0 0;0 0;-10000 0;-10000 0"/>
                  <!-- touchstart 触发：元素飞回 -->
                  <animateTransform additive="replace" attributeName="transform"
                    begin="touchstart+0.21s" calcMode="spline" dur="1000s"
                    fill="remove"
                    keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
                    keyTimes="0;0.0000001;0.001;1" restart="always"
                    type="translate" values="-10000 0;-10000 0;0 0;0 0"/>

                  <!--
                    隐藏的白色矩形（点击热区）
                    为什么要这个？
                    → 因为卡片的内容是图片，图片本身不一定能接收点击
                    → 加一个透明的 rect，确保点击能被捕捉到
                    → pointer-events:visible → 虽然 opacity=0，但能接收事件
                  -->
                  <g opacity="0" style="pointer-events:visible;">
                    <rect fill="#FFFFFF" height="331" stroke="#000000"
                      stroke-miterlimit="10" width="245" x="61.08" y="80.83"/>
                  </g>

                  <!--
                    触摸拦截器
                    为什么需要这个？
                    → 防止用户快速连续点击导致动画错乱
                    → 初始位置在 translate(10000, 0)（画面外）
                    → touchstart 后移到 -100000（更远的地方）
                    → 这样后续的触摸事件不会触发重复动画
                  -->
                  <g transform="translate(10000 0)">
                    <animateTransform attributeName="transform"
                      begin="touchstart" dur="0.61s" fill="remove"
                      restart="always" type="translate"
                      values="-100000 0;-100000 0"/>
                    <g opacity="0" style="pointer-events:visible;">
                      <rect fill="#FFFFFF" height="38" stroke="#000000"
                        stroke-miterlimit="10" width="51" x="152.08" y="450.83"/>
                    </g>
                  </g>
                </g>

                <!-- 翻转后显示的新内容图 -->
                <g>
                  <foreignObject height="100%" width="100%" x="0" y="0">
                    <svg style="background-image:url(&quot;...新内容...&quot;);background-size:100%;background-repeat:no-repeat;line-height:0;" viewBox="0 0 345 586.5"></svg>
                  </foreignObject>
                </g>
              </g>

              <!-- 另一个交互层（touchstart 控制） -->
              <g>
                <animateTransform attributeName="transform" begin="touchstart"
                  dur="0.61s" fill="remove" restart="always"
                  type="translate" values="10000 0;10000 0"/>
                <g opacity="0" style="pointer-events:visible;">
                  <rect fill="#FFFFFF" height="331" stroke="#000000"
                    stroke-miterlimit="10" width="245" x="61.08" y="80.83"/>
                </g>
              </g>
            </svg>
          </section>


          <!--
            === C. 显示层（翻转动画 + 新图片飞入） ===
            这里有 3 个关键动画：
            1. height 动画：click+0.6s 后 section 消失
            2. opacity 动画：click 后显示新内容
            3. rotate 动画：click+0.3s 后卡片翻转 90°
          -->
          <svg viewBox="0 0 345 586.5">
            <!--
              height 动画：section 消失
              → click+0.6 秒后，高度瞬间变为 0
              → 为什么是 click+0.6 而不是 click+0.3？
              → 因为翻转动画需要 0.3 秒（click+0.3 到 click+0.6）
              → 等翻转完成后才消失，视觉上更自然
            -->
            <animate attributeName="height" begin="click+0.6"
              calcMode="discrete" dur="0.0001s" fill="freeze"
              restart="never" to="0"/>

            <!-- 初始 opacity=0 的组 -->
            <g opacity="0">
              <!-- opacity 动画：click 后显示 -->
              <animate attributeName="opacity" begin="click" dur="1000s"
                fill="freeze" keyTimes="0;0.0003;1" restart="never"
                values="0;1;1"/>

              <!-- 底图（翻转后可见的背景） -->
              <g>
                <foreignObject height="100%" width="100%" x="0" y="0">
                  <svg style="background-image:url(&quot;...底图...&quot;);background-size:100%;background-repeat:no-repeat;line-height:0;" viewBox="0 0 345 586.5"></svg>
                </foreignObject>
              </g>

              <!--
                翻转的卡片（rotate 动画）
                → begin="click+0.3": 点击后 0.3 秒开始翻转
                → dur="0.3s": 0.3 秒完成翻转
                → fill="freeze": 保持翻转后的状态

                values="0 172.5 759;90 172.5 759"
                → rotate(角度 中心X 中心Y)
                → 从 0° 旋转到 90°
                → 旋转中心 (172.5, 759)
                → 172.5 = 345/2（水平中心）
                → 759 = 卡片底部位置（这样旋转时卡片像"翻书"一样）

                additive="sum": 叠加到当前 transform 上
                → 不是替换，而是在现有变换基础上叠加
                → 这样翻转效果可以和其他变换组合
              -->
              <g>
                <animateTransform additive="sum" attributeName="transform"
                  begin="click+0.3" dur="0.3s" fill="freeze"
                  restart="whenNotActive" type="rotate"
                  values="0 172.5 759;90 172.5 759"/>

                <!-- 翻转卡片上的隐藏热区 -->
                <g opacity="0" style="pointer-events:visible;">
                  <rect fill="#FFFFFF" height="83" stroke="#000000"
                    stroke-miterlimit="10" width="161" x="97.08" y="503.83"/>
                </g>

                <!-- 翻转的卡片内容（中图） -->
                <g>
                  <foreignObject height="100%" width="100%" x="0" y="0">
                    <svg style="background-image:url(&quot;...中图...&quot;);background-size:100%;background-repeat:no-repeat;line-height:0;" viewBox="0 0 345 586.5"></svg>
                  </foreignObject>
                </g>

                <!--
                  新图片（通过 matrix 变换预旋转）

                  matrix(2.112516e-17 -0.345 0.345 2.112516e-17 -586.3333 931.125)
                  这个矩阵等价于：
                  → rotate(-90°): 预先旋转 -90 度
                  → scale(0.345): 缩放到 34.5%
                  → translate: 定位到正确位置

                  为什么要预旋转 -90°？
                  → 因为外层的 rotate 动画是从 0°→90°
                  → 预旋转 -90° 后，实际效果是：
                    初始：-90° + 0° = -90°（图片竖着显示）
                    结束：-90° + 90° = 0°（图片正常显示）
                  → 视觉效果：图片从"竖着"旋转到"正常"

                  为什么要 scale(0.345)？
                  → 原图是 1000×1700，需要缩放到 345×586.5 的视口
                  → 345/1000 = 0.345
                -->
                <foreignObject style="" x="0" y="0"
                  transform="matrix(2.112516e-17 -0.345 0.345 2.112516e-17 -586.3333 931.125)"
                  width="1000" height="1700">
                  <svg style="display:inline-block;width:100%;vertical-align:top;
                    background-position:0% 0%;background-repeat:no-repeat;
                    background-size:100%;background-attachment:scroll;
                    background-image:url(&quot;...新内容...&quot;);
                    -webkit-tap-highlight-color:transparent;-webkit-user-select:none;"
                    viewBox="0 0 1000 1700"></svg>
                </foreignObject>
              </g>

              <!-- 顶图（翻转后作为背景） -->
              <g>
                <foreignObject height="100%" width="100%" x="0" y="0">
                  <svg style="background-image:url(&quot;...顶图...&quot;);background-size:100%;background-repeat:no-repeat;line-height:0;" viewBox="0 0 345 586.5"></svg>
                </foreignObject>
              </g>
            </g>
          </svg>
        </section>
        <!-- ===== 卡片 1 结束 ===== -->


        <!--
          ==========================================================
          卡片 2 ~ 卡片 8
          ==========================================================
          结构与卡片 1 完全相同，只是：
          - 背景图 URL 不同
          - 新内容图 URL 不同
          - 其他所有属性和动画都一样

          这是"模板化"设计：复制粘贴结构，只改图片
          ==========================================================
        -->

        <!-- 卡片 2 -->
        <section style="overflow:hidden;z-index:100;">
          <section style="pointer-events:none;height:0;">
            <svg viewBox="0 0 345 586.5" x="0px" y="0px">
              <rect fill="#000000" height="100%" opacity="0" style="pointer-events:visible;" width="100%"/>
              <g>
                <g><foreignObject height="100%" width="100%" x="0" y="0"><svg style="background-image:url(&quot;...&quot;);background-size:100%;background-repeat:no-repeat;line-height:0;" viewBox="0 0 345 586.5"></svg></foreignObject></g>
                <g><foreignObject height="100%" width="100%" x="0" y="0"><svg style="background-image:url(&quot;...&quot;);background-size:100%;background-repeat:no-repeat;line-height:0;" viewBox="0 0 345 586.5"></svg></foreignObject></g>
                <g><foreignObject height="100%" width="100%" x="0" y="0"><svg style="background-image:url(&quot;...&quot;);background-size:100%;background-repeat:no-repeat;line-height:0;" viewBox="0 0 345 586.5"></svg></foreignObject></g>
              </g>
              <g opacity="0">
                <animate additive="replace" attributeName="opacity" begin="touchstart+0.21s" calcMode="spline" dur="1000s" fill="remove" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" keyTimes="0;0.0000001;0.001;1" restart="always" values="1;1;0;0"/>
                <animate additive="replace" attributeName="opacity" begin="click+0.01s" calcMode="spline" dur="1000s" fill="remove" keySplines="0.42 0 0.58 1;0.42 0 0.58 1.0;0.42 0 0.58 1.0" keyTimes="0;0.0003;0.0009;1" restart="always" values="0;0;1;1"/>
                <g>
                  <animateTransform additive="replace" attributeName="transform" begin="click+0.01s" calcMode="spline" dur="1000s" fill="remove" keySplines="0.42 0 0.58 1;0.42 0 0.58 1.0;0.42 0 0.58 1.0" keyTimes="0;0.0003;0.00031;1" restart="always" type="translate" values="0 0;0 0;-10000 0;-10000 0"/>
                  <animateTransform additive="replace" attributeName="transform" begin="touchstart+0.21s" calcMode="spline" dur="1000s" fill="remove" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" keyTimes="0;0.0000001;0.001;1" restart="always" type="translate" values="-10000 0;-10000 0;0 0;0 0"/>
                  <g opacity="0" style="pointer-events:visible;"><rect fill="#FFFFFF" height="331" stroke="#000000" stroke-miterlimit="10" width="245" x="61.08" y="80.83"/></g>
                  <g transform="translate(10000 0)"><animateTransform attributeName="transform" begin="touchstart" dur="0.61s" fill="remove" restart="always" type="translate" values="-100000 0;-100000 0"/><g opacity="0" style="pointer-events:visible;"><rect fill="#FFFFFF" height="38" stroke="#000000" stroke-miterlimit="10" width="51" x="152.08" y="450.83"/></g></g>
                </g>
                <g><foreignObject height="100%" width="100%" x="0" y="0"><svg style="background-image:url(&quot;...&quot;);background-size:100%;background-repeat:no-repeat;line-height:0;" viewBox="0 0 345 586.5"></svg></foreignObject></g>
              </g>
              <g><animateTransform attributeName="transform" begin="touchstart" dur="0.61s" fill="remove" restart="always" type="translate" values="10000 0;10000 0"/><g opacity="0" style="pointer-events:visible;"><rect fill="#FFFFFF" height="331" stroke="#000000" stroke-miterlimit="10" width="245" x="61.08" y="80.83"/></g></g>
            </svg>
          </section>
          <svg viewBox="0 0 345 586.5">
            <animate attributeName="height" begin="click+0.6" calcMode="discrete" dur="0.0001s" fill="freeze" restart="never" to="0"/>
            <g opacity="0">
              <animate attributeName="opacity" begin="click" dur="1000s" fill="freeze" keyTimes="0;0.0003;1" restart="never" values="0;1;1"/>
              <g><foreignObject height="100%" width="100%" x="0" y="0"><svg style="background-image:url(&quot;...&quot;);background-size:100%;background-repeat:no-repeat;line-height:0;" viewBox="0 0 345 586.5"></svg></foreignObject></g>
            </g>
            <g>
              <animateTransform additive="sum" attributeName="transform" begin="click+0.3" dur="0.3s" fill="freeze" restart="whenNotActive" type="rotate" values="0 172.5 759;90 172.5 759"/>
              <g opacity="0" style="pointer-events:visible;"><rect fill="#FFFFFF" height="83" stroke="#000000" stroke-miterlimit="10" width="161" x="97.08" y="503.83"/></g>
              <g><foreignObject height="100%" width="100%" x="0" y="0"><svg style="background-image:url(&quot;...&quot;);background-size:100%;background-repeat:no-repeat;line-height:0;" viewBox="0 0 345 586.5"></svg></foreignObject></g>
              <foreignObject style="" x="0" y="0" transform="matrix(2.112516e-17 -0.345 0.345 2.112516e-17 -586.3333 931.125)" width="1000" height="1700"><svg style="display:inline-block;width:100%;vertical-align:top;background-size:100%;background-repeat:no-repeat;background-image:url(&quot;...&quot;);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;" viewBox="0 0 1000 1700"></svg></foreignObject>
            </g>
            <g><foreignObject height="100%" width="100%" x="0" y="0"><svg style="background-image:url(&quot;...&quot;);background-size:100%;background-repeat:no-repeat;line-height:0;" viewBox="0 0 345 586.5"></svg></foreignObject></g>
          </svg>
        </section>

        <!-- 卡片 3 ~ 8 结构相同，此处省略 -->
        <!-- 每个卡片只是图片 URL 不同，交互逻辑完全一致 -->

      </section>
    </section>
    <!-- ===== 卡牌翻转区结束 ===== -->


    <!-- ============================================================
      【阶段四】长图展开区 (z-index:3)
      ============================================================
      最后一次点击后显示，包含：
      1. 高度从 500→5000 的展开动画
      2. 一张完整的长图

      为什么 z-index:3 而不是更高？
      → 因为这个区域在所有卡片翻完之后才显示
      → 它需要在卡片层（z-index:100）下方
      → 但要在商品信息层（z-index:1）上方
      → 所以用 z-index:3

      为什么高度是 500→5000？
      → 500 是初始高度（只显示长图的一小部分）
      → 5000 是展开后的高度（显示完整长图）
      → 2 秒内从 500 扩展到 5000，视觉上像"逐渐展开"
      ============================================================ -->
    <svg height="149.6vw"
      style="min-height:149.6vw;z-index:3;max-height:603vw;overflow:visible;"
      version="1.1" width="88vw" x="0px">
      <!-- height 动画：click+0.5 秒后展开 -->
      <animate attributeName="height" begin="click+0.5" dur="2s"
        fill="freeze" restart="never" values="500;5000"/>
      <!-- 初始 opacity=0 的组 -->
      <g opacity="0">
        <animate attributeName="opacity" begin="click" dur="1000s"
          fill="freeze" keyTimes="0;0.0005;1" restart="never" values="0;1;1"/>
        <!-- 长图内容 -->
        <foreignObject height="100000" width="100%" x="0" y="0">
          <svg style="background-image:url(&quot;...长图...&quot;);
            background-size:100%;background-repeat:no-repeat;
            margin-top:-0vw;line-height:0;"
            viewBox="0 0 345 1500">
            <g opacity="0" style="pointer-events:visible;">
              <rect fill="#FFFFFF" height="83" stroke="#000000"
                stroke-miterlimit="10" width="161" x="97.08" y="503.83"/>
            </g>
          </svg>
        </foreignObject>
      </g>
    </svg>
    <!-- ===== 长图展开区结束 ===== -->

  </section>
</section>

<p style="display:none;"><mp-style-type></mp-style-type></p>
</div>
</body>
</html>
