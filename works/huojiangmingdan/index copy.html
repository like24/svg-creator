<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>获奖名单</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000;
        }
    </style>
</head>

<body>
    <section style="margin: -1px 0px 0px;box-sizing: border-box;">
        <section style="height: 0px;display: block;pointer-events: none;box-sizing: border-box;">
            <svg width="100.00%" style="
                            box-sizing: border-box;
                            transform: rotateZ(0deg);
                            -webkit-transform: rotateZ(0deg);" viewBox="0 0 900 1283" opacity="0">
                <animate style="box-sizing: border-box;" fill="freeze" attributeName="opacity" begin="click" dur="1500"
                    restart="never" keyTimes="0;0.0000;1" values="0;1;1">
                </animate>
                <svg width="100%" height="100%" style="box-sizing: border-box;" role="img" aria-label="插图">

                    <svg x="0.00%" y="0.00%" width="100.00%" style="max-width: 100%;box-sizing: border-box;"
                        height="100.00%" role="img" aria-label="插图">
                        <foreignObject width="100%" height="100%" x="0%" y="0%" style="box-sizing: border-box;">
                            <svg space="default"
                                style="display: block;width: 100%;background-position: 0% 0%;background-repeat: no-repeat;background-size: cover;background-attachment: scroll;-webkit-tap-highlight-color: transparent;visibility: visible;pointer-events: none;background-image: url(&quot;https://mmecoa.qpic.cn/mmecoa_gif/CdHIoibWyZ5SibaRLJqaicqs7tDIo1iaUQo9a01pmAo3JiaKVzXyzSZicxagJRFO1HuibkicFLbZ6h5g0Gfh3GHJsficvTQ/640?wx_fmt=gif&amp;tp=webp&amp;wxfrom=10015&amp;wx_lazy=1&quot;);box-sizing: border-box;user-select: none;"
                                viewBox="0 0 900 1283" xlink="http://www.w3.org/1999/xlink" xml=""
                                xmlns="http://www.w3.org/2000/svg"
                                data-lazy-bgimg="https://mmecoa.qpic.cn/mmecoa_gif/CdHIoibWyZ5SibaRLJqaicqs7tDIo1iaUQo9a01pmAo3JiaKVzXyzSZicxagJRFO1HuibkicFLbZ6h5g0Gfh3GHJsficvTQ/640?wx_fmt=gif"
                                role="img" aria-label="插图" data-fail="0"></svg>
                        </foreignObject>
                    </svg>
                    <svg width="100.00%" xmlns="http://www.w3.org/2000/svg"
                        style="box-sizing: border-box;transform: rotateZ(0deg);-webkit-transform: rotateZ(0deg);-moz-transform: rotateZ(0deg);-o-transform: rotateZ(0deg);width: 100%;"
                        viewBox="0 0 900 1283" opacity="0" role="img" aria-label="插图">
                        <animate style="box-sizing: border-box;" fill="freeze" attributeName="opacity"
                            begin="click + 5.51s" from="0" to="1" dur="0.01" restart="never"></animate>
                        <svg width="100%" height="100%" style="box-sizing: border-box;" role="img" aria-label="插图">
                            <svg width="100%" height="100%" style="box-sizing: border-box;" role="img" aria-label="插图">
                                <rect fill="transparent" width="100%" height="100%" style="box-sizing: border-box;"
                                    x="0%" y="0%"></rect>
                                <foreignObject x="0%" y="0%" width="100%" height="100%" style="box-sizing: border-box;">
                                    <svg style="background-position: center center;background-size: cover;background-repeat: no-repeat;background-image: url(&quot;https://mmecoa.qpic.cn/mmecoa_jpg/CdHIoibWyZ5SibaRLJqaicqs7tDIo1iaUQo9EdkhhqiacSNNtrS5aSvveFYM0YHJTCdd2qAvPgCC1cLzZ0YEnkHxCQg/640?wx_fmt=jpeg&amp;tp=webp&amp;wxfrom=10015&amp;wx_lazy=1&quot;);box-sizing: border-box;"
                                        viewBox="0 0 900 1283"
                                        data-lazy-bgimg="https://mmecoa.qpic.cn/mmecoa_jpg/CdHIoibWyZ5SibaRLJqaicqs7tDIo1iaUQo9EdkhhqiacSNNtrS5aSvveFYM0YHJTCdd2qAvPgCC1cLzZ0YEnkHxCQg/640?wx_fmt=jpeg"
                                        role="img" aria-label="插图" data-fail="0"></svg>
                                </foreignObject>
                            </svg>
                            <svg x="0.00%" y="0.00%" width="100.00%" xmlns="http://www.w3.org/2000/svg"
                                style="max-width: 100%;box-sizing: border-box;" height="100.00%" role="img"
                                aria-label="插图">
                                <foreignObject width="100%" height="100%" x="0%" y="0%" style="box-sizing: border-box;">
                                    <svg space="default"
                                        style="display: block;width: 100%;background-position: 0% 0%;background-repeat: no-repeat;background-size: cover;background-attachment: scroll;-webkit-tap-highlight-color: transparent;visibility: visible;pointer-events: none;background-image: url(&quot;https://mmecoa.qpic.cn/mmecoa_png/CdHIoibWyZ5SibaRLJqaicqs7tDIo1iaUQo9av5lXyAUfaOmMZkJqiab1leG9LqIUcuDpgoL28voCmbK6BWaXFGw57Q/640?wx_fmt=png&amp;tp=webp&amp;wxfrom=10015&amp;wx_lazy=1&quot;);box-sizing: border-box;user-select: none;"
                                        viewBox="0 0 900 1283" xlink="http://www.w3.org/1999/xlink" xml=""
                                        xmlns="http://www.w3.org/2000/svg"
                                        data-lazy-bgimg="https://mmecoa.qpic.cn/mmecoa_png/CdHIoibWyZ5SibaRLJqaicqs7tDIo1iaUQo9av5lXyAUfaOmMZkJqiab1leG9LqIUcuDpgoL28voCmbK6BWaXFGw57Q/640?wx_fmt=png"
                                        role="img" aria-label="插图" data-fail="0"></svg>
                                </foreignObject>
                            </svg>
                            <svg width="100%" height="100%" style="box-sizing: border-box;" role="img" aria-label="插图">
                                <rect style="box-sizing: border-box;opacity: 0;pointer-events: auto;" x="0" y="0"
                                    width="100%" height="100%">
                                    <animate from="0" to="0" dur="0" begin="click + 0.1s" fill="freeze"
                                        attributeName="width" style="box-sizing: border-box;"></animate>
                                </rect>
                            </svg>
                        </svg>

                    </svg>
                </svg>

            </svg>
        </section>
        <svg viewBox="0 0 900 1283" style="float:left;line-height:0;width:0;vertical-align:top;" role="img"
            aria-label="插图"></svg>
    </section>

</html>
