<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>获奖名单</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>
    <section data-name="最外层的容器" style="
        overflow: hidden;
        font-size: 0;
        line-height: 0;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      ">
        <svg viewBox="0 0 1080 1890" style="
              display: block;
              width: 100%;
              margin-top: -1px;
              pointer-events: none;
              -webkit-user-select: none;
              user-select: none;
              -webkit-tap-highlight-color: transparent;
            ">
            <image href="./imgs/1.png" x="0" y="0" width="1080" height="1890"></image>
            <image href="./imgs/1.gif" x="0" y="0" width="1080" height="1890"></image>
            <image href="./imgs/tip.png" x="0" y="0" width="1080" height="1890"></image>
        </svg>
        <svg viewBox="0 0 1080 2160" style="
              display: block;
              width: 100%;
              margin-top: -1px;
              pointer-events: none;
              -webkit-user-select: none;
              user-select: none;
              -webkit-tap-highlight-color: transparent;
            ">
            <image href="./imgs/2.png" x="0" y="0" width="1080" height="2160"></image>

        </svg>
        <section style="overflow: hidden; visibility: visible">
            <section style="height: 0;">
                <svg viewBox="0 0 1080 2980" style="
                    display: block;
                    width: 100%;
                    margin-top: -1px;
                    pointer-events: none;
                    -webkit-user-select: none;
                    user-select: none;
                    -webkit-tap-highlight-color: transparent;
              ">
                    <image href="./imgs/3.png" x="0" y="0" width="1080" height="2980"></image>
                    <g>
                        <animate attributeName="opacity" values="0.1;0.7;0.1" dur="2s" repeatCount="indefinite">
                        </animate>
                        <image href="./imgs/tip1.png" x="0" y="0" width="1080" height="2980"></image>
                    </g>
                </svg>
            </section>
            <section style="height: 0px">
                <svg viewBox="0 0 1080 2980" style="
                    display: block;
                    width: 100%;
                    margin-top: -1px;
                    pointer-events: none;
                    -webkit-user-select: none;
                    user-select: none;
                    -webkit-tap-highlight-color: transparent;
                    " opacity="0">
                    <animate style="box-sizing: border-box;" fill="freeze" attributeName="opacity" begin="click"
                        dur="1s" restart="never" keyTimes="0;0.0000;1" values="0;1;1">
                    </animate>
                    <image href="./imgs/3-1.png" x="0" y="0" width="1080" height="2980"></image>
                    <g>
                        <set attributeName="visibility" from="visible" to="hidden" fill="freeze" restart="never"
                            begin="click+3s"></set>
                        <image href="./imgs/3.gif" x="0" y="0" width="1080" height="2980"></image>
                        <rect style="box-sizing: border-box;opacity: 0;pointer-events: auto;" x="0" y="0" width="100%"
                            height="100%">
                            <animate from="0" to="0" dur="0" begin="click + 0.1s" fill="freeze" attributeName="width"
                                style="box-sizing: border-box;"></animate>
                        </rect>
                    </g>


                </svg>
            </section>
            <svg viewBox="0 0 1080 2980" style="
                display: block;
                width: 100%;
                margin-top: -1px;
                pointer-events: none;
                -webkit-user-select: none;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
              ">

            </svg>
        </section>

        <section style="overflow: hidden; visibility: visible">
            <section style="height: 0;">
                <svg viewBox="0 0 1080 2500" style="
                    display: block;
                    width: 100%;
                    margin-top: -1px;
                    pointer-events: none;
                    -webkit-user-select: none;
                    user-select: none;
                    -webkit-tap-highlight-color: transparent;
              ">
                    <image href="./imgs/4.png" x="0" y="0" width="1080" height="2500"></image>
                    <g>
                        <animate attributeName="opacity" values="0.1;0.7;0.1" dur="2s" repeatCount="indefinite">
                        </animate>
                        <image href="./imgs/tip2.png" x="0" y="0" width="1080" height="2500"></image>

                    </g>
                </svg>
            </section>
            <section style="height: 0px">
                <svg viewBox="0 0 1080 2500" style="
                    display: block;
                    width: 100%;
                    margin-top: -1px;
                    pointer-events: none;
                    -webkit-user-select: none;
                    user-select: none;
                    -webkit-tap-highlight-color: transparent;
                    " opacity="0">
                    <animate style="box-sizing: border-box;" fill="freeze" attributeName="opacity" begin="click"
                        dur="1s" restart="never" keyTimes="0;0.0000;1" values="0;1;1">
                    </animate>
                    <image href="./imgs/4-1.png" x="0" y="0" width="1080" height="2500"></image>
                    <g>
                        <set attributeName="visibility" from="visible" to="hidden" fill="freeze" restart="never"
                            begin="click+4.05s"></set>
                        <image href="./imgs/4.gif" x="0" y="0" width="1080" height="2500"></image>
                        <rect style="box-sizing: border-box;opacity: 0;pointer-events: auto;" x="0" y="0" width="100%"
                            height="100%">
                            <animate from="0" to="0" dur="0" begin="click + 0.1s" fill="freeze" attributeName="width"
                                style="box-sizing: border-box;"></animate>
                        </rect>
                    </g>


                </svg>
            </section>
            <svg viewBox="0 0 1080 2500" style="
                display: block;
                width: 100%;
                margin-top: -1px;
                pointer-events: none;
                -webkit-user-select: none;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
              ">

            </svg>
        </section>
    </section>
</body>

</html>
