<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>未成年人陪伴片单</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {}
  </style>
</head>

<body>
  <p><span leaf="">11111111111</span></p>
  <section data-name="最外层的容器" style="
        overflow: hidden;
        font-size: 0;
        line-height: 0;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      ">
    <section style="overflow: hidden; visibility: visible">
      <section style="height: 0">
        <svg viewBox="0 0 750 1100" style="
              display: block;
              width: 100%;
              margin-top: -1px;
              pointer-events: none;
              -webkit-user-select: none;
              user-select: none;
              -webkit-tap-highlight-color: transparent;
            ">
          <image href="./imgs/head.jpg" x="0" y="0" width="750" height="1100"></image>
        </svg>

        <section style="height: 0;">
          <svg viewBox="0 0 750 1311" style="
                display: block;
                width: 100%;
                margin-top: -1px;
                pointer-events: none;
                -webkit-user-select: none;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
              ">
            <image href="./imgs/bg.jpg" x="0" y="0" width="750" height="1311"></image>
          </svg>
        </section>
        <section style="overflow: scroll hidden; width: 100% !important; pointer-events: painted">
          <svg viewBox="0 0 5250 1311"
            style="display: block; width: 700%; pointer-events: none; user-select: none; max-width: none !important">
            <g>
              <image x="0" y="0" width="750" height="1311" href="./imgs/1.png"></image>
              <image x="750" y="0" width="750" height="1311" href="./imgs/2.png"></image>
              <image x="1500" y="0" width="750" height="1311" href="./imgs/3.png"></image>
              <image x="2250" y="0" width="750" height="1311" href="./imgs/4.png"></image>
              <image x="3000" y="0" width="750" height="1311" href="./imgs/5.png"></image>
              <image x="3750" y="0" width="750" height="1311" href="./imgs/6.png"></image>
              <image x="4500" y="0" width="750" height="1311" href="./imgs/7.png"></image>
            </g>
          </svg>
        </section>
        <svg viewBox="0 0 750 232" style="
              display: block;
              width: 100%;
              margin-top: -1px;
              pointer-events: none;
              -webkit-user-select: none;
              user-select: none;
              -webkit-tap-highlight-color: transparent;
            ">
          <image href="./imgs/foot.jpg" x="0" y="0" width="750" height="253"></image>
        </svg>
      </section>
      <svg viewBox="0 0 750 1100" style="
            transform: scale(1);
            display: block;
            width: 100%;
            max-width: none !important;
            pointer-events: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
          ">

        <animate calcMode="spline" attributeName="width" values="100%;240.3%;240.3%" dur="1s" keyTimes="0;0.125;1"
          keySplines=".42,0,.58,1;.42,0,.58,1" fill="freeze" restart="never" begin="click+0.3s"></animate>

        <g>
          <set attributeName="visibility" from="visible" to="hidden" fill="freeze" restart="never" begin="click+0.1s">
          </set>
          <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite" begin="0s"
            calcMode="spline" keyTimes="0;0.5;1" keySplines=".42 0 .58 1;.42 0 .58 1"></animate>
          <image x="262" y="950" width="225" height="99" href="./imgs/btn.png"></image>
          <rect x="200" y="950" width="350" height="100" fill="#39f" opacity="0" style="pointer-events: visible">
            <animate attributeName="x" values="88888888" dur="0.001s" fill="freeze" restart="never" begin="click">
            </animate>
          </rect>
        </g>

      </svg>
    </section>
  </section>
  <p><span leaf="">11111111111</span></p>
</body>

</html>
