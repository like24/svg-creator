        <image href="./imgs/card1/1.png" x="0" y="0" width="1080" height="1134"></image>
        <g>
          <!-- ① 最外层：左移 -1250 -->
          <g style="cursor: pointer">
            <animateTransform
              attributeName="transform"
              type="translate"
              from="0 0"
              to="-1250 0"
              begin="click"
              dur="0.8s"
              fill="freeze"
              restart="never"
            />
            <image href="./imgs/card1/left2.png" x="0" y="0" width="1080" height="1134" style="pointer-events: none"></image>
            <!-- <image href="./imgs/card1/left1.png" x="0" y="0" width="1080" height="1134"></image> -->

            <!-- ② 叠加 +2500 → right.png 净位移 +1250（向右） -->

              <animateTransform
                attributeName="transform"
                type="translate"
                from="0 0"
                to="2500 0"
                begin="click"
                dur="0.8s"
                fill="freeze"
                restart="never"
              />
              <image href="./imgs/card1/right.png" x="0" y="0" width="1080" height="1134" style="pointer-events: none"></image>

              <!-- ③ 抵消 right 的 +2500 → 1.gif 净位移 -1250（向左） -->

                <animateTransform
                  attributeName="transform"
                  type="translate"
                  from="0 0"
                  to="-2500 0"
                  begin="click"
                  dur="0.8s"
                  fill="freeze"
                  restart="never"
                />
                <image href="./imgs/card1/1.gif" x="0" y="2" width="1080" height="1130" style="pointer-events: none"></image>

                <!-- ④ 再叠加 +1250 → mask 净位移 0（不动） -->
                <g>
                  <animateTransform
                    attributeName="transform"
                    type="translate"
                    from="0 0"
                    to="1250 0"
                    begin="click"
                    dur="0.8s"
                    fill="freeze"
                    restart="never"
                  />

                  <!-- 提示层：点击后立即左移退出 -->
                  <g>
                    <animateTransform
                      attributeName="transform"
                      type="translate"
                      from="0 0"
                      to="-1250 0"
                      begin="click"
                      dur="0.001s"
                      fill="freeze"
                      restart="never"
                    />
                    <image href="./imgs/tip.png" x="0" y="0" width="1080" height="1134" style="pointer-events: none">
                      <animate
                        attributeName="opacity"
                        values="1;0.6;1"
                        dur="2s"
                        repeatCount="indefinite"
                        begin="0s"
                        calcMode="spline"
                        keyTimes="0;0.5;1"
                        keySplines=".42 0 .58 1;.42 0 .58 1"
                      ></animate>
                    </image>

                    <!-- 揭晓层：抵消提示层位移，点击 0.8s 后淡入 -->
                    <g opacity="0">
                      <animateTransform
                        attributeName="transform"
                        type="translate"
                        from="0 0"
                        to="1250 0"
                        begin="click"
                        dur="0.001s"
                        fill="freeze"
                        restart="never"
                      />
                      <animate
                        attributeName="opacity"
                        from="0"
                        to="1"
                        begin="click+0.8s"
                        dur="0.8s"
                        fill="freeze"
                        restart="never"
                      ></animate>
                      <image href="./imgs/card1/2.png" x="0" y="0" width="1080" height="1134" style="pointer-events: none"></image>
                      <g>

                        <rect

                          y="0"
                          width="1080"
                          height="1134"

                          style="pointer-events: visible; cursor: pointer"
                        >
                          <animate attributeName="x" from="0" to="88888888" begin="click" dur="0.001s" fill="freeze" restart="never" />
                        </rect>
                      </g>

              to="0 1250"
              begin="click"
              dur="0.001s"
              fill="freeze"
              restart="never"
            />

            <image href="./imgs/tip.png" x="0" y="0" width="1080" height="1134" style="pointer-events: none">
              <animate
                attributeName="opacity"
                values="1;0.6;1"
                dur="2s"
                repeatCount="indefinite"
                begin="0s"
                calcMode="spline"
                keyTimes="0;0.5;1"
                keySplines=".42 0 .58 1;.42 0 .58 1"
              ></animate>
            </image>

            <!-- 抵消提示层的瞬时位移 -->
            <g>
              <animateTransform
                attributeName="transform"
                type="translate"
                from="0 0"
                to="0 -1250"
                begin="click"
                dur="0.001s"
                fill="freeze"
                restart="never"
              />

              <!-- 反向补偿水层位移，使揭晓层始终停在原位 -->
              <g opacity="0">
                <animateTransform
                  attributeName="transform"
                  type="translate"
                  from="0 0"
                  to="0 -1250"
                  begin="click"
                  dur="0.8s"
                  fill="freeze"
                  restart="never"
                />
                <animate attributeName="opacity" from="0" to="1" begin="click+0.8s" dur="0.8s" fill="freeze" restart="never"></animate>

                <image href="./imgs/card9/2.png" x="0" y="0" width="1080" height="1134" style="pointer-events: none"></image>

                <!-- 实际点击区域：点击后立即停用 -->
                <g>
                  <set attributeName="visibility" from="visible" to="hidden" begin="click" fill="freeze" restart="never" />
                  <rect x="0" y="0" width="1080" height="1134" fill="#3399ff" opacity="0" style="pointer-events: visible; cursor: pointer">
                    <animate attributeName="y" from="0" to="88888888" begin="click" dur="0.001s" fill="freeze" restart="never" />
                  </rect>
                </g>
              </g>
            </g>
          </g>
        </g>

        <image href="./imgs/card9/mask.png" x="0" y="0" width="1080" height="1134" style="pointer-events: none"></image>
      </svg>
      <svg
        viewBox="0 0 1081 646"
        style="
          display: block;
          width: 100%;
          margin-top: -2px;
          pointer-events: none;
          user-select: none;
          -webkit-tap-highlight-color: transparent;
        "
      >
        <image href="./imgs/foot.png" x="0" y="0" width="1080" height="646"></image>
      </svg>
    </section>
  </body>
</html>
