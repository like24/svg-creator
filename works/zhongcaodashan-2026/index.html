      <svg
        viewBox="0 0 1080 1907"
        style="

          width: 100%;

      <svg
        viewBox="0 0 1080 350"
        style="
          display: block;
          width: 100%;
          margin-top: -1px;

          pointer-events: none;
          user-select: none;
          -webkit-tap-highlight-color: transparent;
        "
      ></svg>
      <svg viewBox="0 0 1080 1134" style="display: block; width: 100%; margin-top: -1px; -webkit-tap-highlight-color: transparent">
        <image href="./imgs/card1/1.png" x="0" y="0" width="1080" height="1134"></image>
        <g>
          <g style="cursor: pointer">
            <animateTransform
              attributeName="transform"
              type="translate"
              from="0 0"
              to="-1250 0"
              begin="click"
              dur="0.8s"
              fill="freeze"
              restart="never"
            />
            <image href="./imgs/card1/left2.png" x="0" y="0" width="1080" height="1134"></image>
            <image href="./imgs/card1/1.gif" x="0" y="0" width="1080" height="1134"></image>
            <!-- <image href="./imgs/card1/left1.png" x="0" y="0" width="1080" height="1134"></image> -->

            <g>
              <animateTransform
                attributeName="transform"
                type="translate"
                from="0 0"
                to="2500 0"
                begin="click"
                dur="0.8s"
                fill="freeze"
                restart="never"
              />

              <!-- 图片3最终向右移动1250 -->
              <image href="./imgs/card1/right.png" x="0" y="0" width="1080" height="1134"></image>
              <g>
                <animateTransform
                  attributeName="transform"
                  type="translate"
                  from="0 0"
                  to="-1250 0"
                  begin="click"
                  dur="0.8s"
                  fill="freeze"
                  restart="never"
                />

                <!-- 提示层点击后立即左移；揭晓层用反向位移保持原位 -->
                <g>
                  <animateTransform
                    attributeName="transform"
                    type="translate"
                    from="0 0"
                    to="-1250 0"
                    begin="click"
                    dur="0.001s"
                    fill="freeze"
                    restart="never"
                  />

                  <image href="./imgs/tip.png" x="0" y="0" width="1080" height="1134" style="pointer-events: none">
                    <animate
                      attributeName="opacity"
                      values="1;0.6;1"
                      dur="2s"
                      repeatCount="indefinite"
                      begin="0s"
                      calcMode="spline"
                      keyTimes="0;0.5;1"
                      keySplines=".42 0 .58 1;.42 0 .58 1"
                    ></animate>
                  </image>

                  <!-- 1.png 默认隐藏，点击 0.8s 后开始淡入 -->
                  <g opacity="0">
                    <animateTransform
                      attributeName="transform"
                      type="translate"
                      from="0 0"
                      to="1250 0"
                      begin="click"
                      dur="0.001s"
                      fill="freeze"
                      restart="never"
                    />
                    <animate attributeName="opacity" from="0" to="1" begin="click+0.8s" dur="0.8s" fill="freeze" restart="never"></animate>

                    <image href="./imgs/card1/2.png" x="0" y="0" width="1080" height="1134" style="pointer-events: none"></image>

                    <!-- 实际点击区域：点击后立即停用，避免重复拦截 -->
                    <g>
                      <set attributeName="visibility" from="visible" to="hidden" begin="click" fill="freeze" restart="never" />
                      <rect
                        x="0"
                        y="0"
                        width="1080"
                        height="1134"
                        fill="#3399ff"
                        opacity="0"
                        style="pointer-events: visible; cursor: pointer"
                      >
                        <animate attributeName="x" from="0" to="88888888" begin="click" dur="0.001s" fill="freeze" restart="never" />
                      </rect>
                    </g>
                  </g>
                </g>

                <image href="./imgs/card1/mask.png" x="0" y="0" width="1080" height="1134" style="pointer-events: none"></image>
              </g>
            </g>
          </g>
        </g>
